# toml-test (design section 15, roadmap Stage 1): the committed suite equals
# a fresh fetch at the pinned tag, and every case runs through the current
# check phase for TOML 1.0.0 and 1.1.0. Every valid case must be accepted.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: conformance

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload
      - run: tools/run-conformance
