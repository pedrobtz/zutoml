# toml-test (design section 15): the committed suite equals a fresh fetch at
# the pinned tag; every case, for TOML 1.0.0 and 1.1.0, gives the answer it
# should through toml_validate(); and toml_emit()'s text for every valid
# case is accepted by toml-test's reference decoder (BurntSushi/toml, pinned)
# and by Python's tomllib (acceptance criterion 3).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: conformance

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install the reference decoder
        run: |
          go install github.com/BurntSushi/toml/cmd/toml-test-decoder@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: tools/run-conformance
