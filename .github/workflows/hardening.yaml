# The gates that keep the C boundary honest (roadmap Stage 1). Each was seen
# to fail on a planted defect before it was trusted.
#
#   lint      project C warning-free under -Wall -Wextra -Wpedantic -Werror
#   symbols   the installed .so exports R_init_zutoml only; no stdio or exit
#   mutation  every /* GUARD */ in the check phase is load-bearing
#   fuzz      libFuzzer over the R-free check phase, canary first; the grown
#             corpus is cached between runs, so fuzzing accumulates:
#             2 minutes per pull-request push, 30 minutes nightly
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

name: hardening

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    name: lint, symbols, mutation
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload
      - run: tools/run-lint
      - run: tools/run-mutation-check
      - name: Install and check symbols
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          R CMD INSTALL -l "$RUNNER_TEMP/lib" .
          tools/check-symbols "$RUNNER_TEMP/lib/zutoml/libs/zutoml.so"

  fuzz:
    runs-on: ubuntu-latest
    name: fuzz (check phase)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        env:
          FUZZ_CC: clang
        run: tools/run-fuzz ${{ github.event_name == 'schedule' && 1800 || 120 }}
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
