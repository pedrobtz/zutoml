url: https://pedrobtz.github.io/zutoml/
template:
  bootstrap: 5

# A release version (0.1.0) builds the site at the root; a development
# version (0.1.0.9000) builds it into dev/, leaving the released docs at the
# root. The deploy step keeps both (clean: false in pkgdown.yaml).
development:
  mode: auto

reference:
  - title: Read TOML
    contents:
      - toml_parse
      - toml_validate
  - title: Write TOML
    contents:
      - toml_emit
  - title: Values
    contents:
      - toml_bigint
  - title: Errors and build information
    contents:
      - zutoml-conditions
      - zutoml_info
      - zutoml-package
